<div class="fixed inset-0 z-[100] flex items-center justify-center bg-[#0A0B10]/80 backdrop-blur p-4 font-sans">
  <div class="bg-[#151822] border border-[#1E293B] rounded-xl w-full max-w-3xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
    <div class="flex items-center justify-between p-5 border-b border-[#1E293B]">
      <h3 class="text-lg font-bold text-white">{{ lecture() ? 'Editar Palestra' : 'Nova Palestra' }}</h3>
      <button type="button" (click)="close.emit()" class="text-[#94A3B8] hover:text-white transition-colors cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <div class="p-6 md:p-8 overflow-y-auto custom-scrollbar">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="flex flex-col gap-2">
            <label class="text-xs font-semibold text-[#94A3B8]">Nome do Palestrante *</label>
            <input type="text" formControlName="speaker" class="h-10 px-3 py-2 bg-[#1E293B]/50 border border-[#334155] rounded-md text-sm text-white focus:outline-none focus:border-[#00B090]" />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-xs font-semibold text-[#94A3B8]">Nome da Palestra *</label>
            <input type="text" formControlName="title" class="h-10 px-3 py-2 bg-[#1E293B]/50 border border-[#334155] rounded-md text-sm text-white focus:outline-none focus:border-[#00B090]" />
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-xs font-semibold text-[#94A3B8]">Descrição *</label>
          <textarea formControlName="description" rows="3" class="px-3 py-2 bg-[#1E293B]/50 border border-[#334155] rounded-md text-sm text-white focus:outline-none focus:border-[#00B090] resize-none"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="flex flex-col gap-2">
            <label class="text-xs font-semibold text-[#94A3B8]">Data *</label>
            <input type="date" formControlName="date" class="h-10 px-3 py-2 bg-[#1E293B]/50 border border-[#334155] rounded-md text-sm text-white focus:outline-none focus:border-[#00B090] [color-scheme:dark]" />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-xs font-semibold text-[#94A3B8]">Horário *</label>
            <input type="time" formControlName="time" class="h-10 px-3 py-2 bg-[#1E293B]/50 border border-[#334155] rounded-md text-sm text-white focus:outline-none focus:border-[#00B090] [color-scheme:dark]" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="flex flex-col gap-2">
            <label class="text-xs font-semibold text-[#94A3B8]">Tipo *</label>
            <select formControlName="type" class="h-10 px-3 py-2 bg-[#1E293B]/50 border border-[#334155] rounded-md text-sm text-white focus:outline-none focus:border-[#00B090]">
              <option value="Palestra">Palestra</option>
              <option value="Oficina">Oficina</option>
            </select>
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-xs font-semibold text-[#94A3B8]">Público-alvo *</label>
            <select formControlName="targetAudience" class="h-10 px-3 py-2 bg-[#1E293B]/50 border border-[#334155] rounded-md text-sm text-white focus:outline-none focus:border-[#00B090]">
              <option value="Todos">Todos</option>
              <option value="Devs">Devs</option>
              <option value="Gestores">Gestores</option>
              <option value="RH">RH</option>
              <option value="Negócios">Negócios</option>
            </select>
          </div>
        </div>

        <div class="flex flex-col gap-2 mt-2">
          <label class="text-xs font-semibold text-[#94A3B8]">Foto do Palestrante</label>
          <div class="flex items-center gap-3 mt-1">
            <label class="bg-[#10B981] hover:bg-[#059669] text-[#0A0B10] font-bold text-xs py-2 px-4 rounded transition-colors relative cursor-pointer inline-flex items-center">
              Escolher arquivo
              <input type="file" accept="image/*" (change)="onFileChange($event)" class="absolute inset-0 opacity-0 cursor-pointer hidden" />
            </label>
            <span class="text-xs text-[#64748B]">
              {{ form.value.speakerImagePath ? 'Arquivo selecionado' : 'Nenhum arquivo escolhido...' }}
            </span>
          </div>
        </div>

      </form>
    </div>

    <!-- Actions Footer -->
    <div class="flex items-center justify-end gap-3 p-5 border-t border-[#1E293B] bg-[#0A0B10]">
      <button type="button" (click)="close.emit()" class="text-sm font-medium text-[#94A3B8] hover:text-white px-4 py-2 border border-transparent hover:border-[#334155] rounded-md transition-all cursor-pointer">Cancelar</button>
      <button type="button" (click)="onSubmit()" [disabled]="form.invalid" class="bg-[#10B981] hover:bg-[#059669] text-[#0A0B10] font-bold text-sm px-6 py-2 rounded-md transition-colors disabled:opacity-50 cursor-pointer">
        {{ lecture() ? 'Salvar' : 'Criar' }}
      </button>
    </div>

  </div>
</div>
